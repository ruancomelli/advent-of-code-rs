[package]
name = "advent_of_code"
version = "0.11.0"
authors = ["Ruan Comelli <me@ruancomelli.com>"]
edition = "2024"
default-run = "advent_of_code"
publish = false

[workspace]
members = ["year_template", "2025"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
doctest = false

[profile.dhat]
inherits = "release"
debug = 1

[features]
dhat-heap = ["dhat"]
today = ["chrono"]
test_lib = []

[dependencies]

# Template dependencies
chrono = { version = "0.4.38", optional = true }
dhat = { version = "0.3.3", optional = true }
pico-args = "0.5.0"
tinyjson = "2.5.1"

# Solution dependencies
